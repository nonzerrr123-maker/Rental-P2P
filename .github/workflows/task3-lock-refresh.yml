name: TASK 3 package-lock refresh

on:
  pull_request:
    paths:
      - "my-app/package.json"
      - ".github/workflows/task3-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh package lock
        working-directory: my-app
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lock when needed
        run: |
          if git diff --quiet -- my-app/package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-app/package-lock.json
          git commit -m "chore: refresh package lock"
          git push origin HEAD:${{ github.head_ref }}
