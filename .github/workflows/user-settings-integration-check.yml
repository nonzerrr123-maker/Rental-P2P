name: User settings integration check

on:
  pull_request:
    paths:
      - "my-app/app/settings/**"
      - "my-app/app/profile/page.tsx"
      - "my-app/app/users/**"
      - "my-app/app/rent/**"
      - "my-app/app/api/settings/**"
      - "my-app/lib/forms/settings.ts"
      - "my-app/docs/migrations/**"
      - ".github/workflows/user-settings-integration-check.yml"

jobs:
  validate-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p2p_rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d p2p_rental"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/p2p_rental
      DATABASE_POOL_MAX: 5
      NEXT_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-app/package-lock.json
      - run: npm ci
      - name: Apply schema and tracked migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/database-schema.sql
          npm run db:migrate
      - name: Scoped lint
        run: >-
          npx eslint
          lib/forms/settings.ts
          app/api/settings/profile/route.ts
          app/api/settings/security/password/route.ts
          app/api/settings/security/sessions/route.ts
          app/settings/page.tsx
          app/settings/profile/page.tsx
          app/settings/profile/profile-settings-form.tsx
          app/settings/security/page.tsx
          app/settings/security/security-settings-client.tsx
          app/profile/page.tsx
          app/users/[id]/page.tsx
          app/rent/[id]/page.tsx
      - run: npm run build
      - name: Start application
        run: |
          nohup npm run start -- -p 3000 > /tmp/settings-next.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/api/health/db >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/settings-next.log
          exit 1
      - name: Guest cannot mutate profile
        run: |
          code=$(curl --silent --output /tmp/guest-profile.json --write-out "%{http_code}" -X PATCH http://127.0.0.1:3000/api/settings/profile -H 'Content-Type: application/json' --data '{"displayName":"Guest","phone":"0812345678","bio":"guest"}')
          test "$code" = "401"
      - name: Register and create two sessions
        run: |
          curl --fail --silent -X POST http://127.0.0.1:3000/api/auth/register -H 'Content-Type: application/json' --data '{"displayName":"Settings User","email":"settings@example.com","password":"settings-password-123"}' > /tmp/register-settings.json
          curl --fail --silent -c /tmp/session-a.txt -X POST http://127.0.0.1:3000/api/auth/login -H 'Content-Type: application/json' --data '{"email":"settings@example.com","password":"settings-password-123"}' > /tmp/login-a.json
          curl --fail --silent -c /tmp/session-b.txt -X POST http://127.0.0.1:3000/api/auth/login -H 'Content-Type: application/json' --data '{"email":"settings@example.com","password":"settings-password-123"}' > /tmp/login-b.json
          psql "$DATABASE_URL" -Atc "SELECT count(*) FROM user_sessions s JOIN users u ON u.id=s.user_id WHERE u.email='settings@example.com' AND s.revoked_at IS NULL" | grep '^2$'
      - name: List active sessions and identify current
        run: |
          curl --fail --silent -b /tmp/session-b.txt http://127.0.0.1:3000/api/settings/security/sessions > /tmp/sessions-before.json
          node -e 'const d=require("/tmp/sessions-before.json"); if(!d.ok || d.sessions.length!==2 || d.sessions.filter(x=>x.current).length!==1) process.exit(1)'
      - name: Update profile authoritatively
        run: |
          curl --fail --silent -b /tmp/session-b.txt -X PATCH http://127.0.0.1:3000/api/settings/profile -H 'Content-Type: application/json' --data '{"displayName":"Settings Updated","phone":"0812345678","bio":"คนชลบุรี ชอบอุปกรณ์แคมป์ปิ้งและดูแลของทุกชิ้นเอง"}' > /tmp/profile-updated.json
          node -e 'const d=require("/tmp/profile-updated.json"); if(!d.ok || d.profile.displayName!=="Settings Updated" || d.profile.phone!=="0812345678" || !d.profile.bio.includes("ชลบุรี")) process.exit(1)'
          psql "$DATABASE_URL" -Atc "SELECT display_name || ':' || phone || ':' || bio FROM users WHERE email='settings@example.com'" | grep 'Settings Updated:0812345678:คนชลบุรี'
      - name: Seed public trust data
        run: |
          user_id=$(psql "$DATABASE_URL" -Atc "SELECT id FROM users WHERE email='settings@example.com'")
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE users SET verification_status='VERIFIED', rating_average=5.00, rating_count=1 WHERE id='$user_id'; INSERT INTO rental_items(owner_id,title,category,description,condition,daily_rate,province) VALUES ('$user_id','Public Profile Tent','แคมป์ปิ้ง','เต็นท์สำหรับทดสอบ public profile','GOOD',350,'ชลบุรี');"
          echo "$user_id" > /tmp/settings-user-id
      - name: Reject invalid current password
        run: |
          code=$(curl --silent --output /tmp/bad-password.json --write-out "%{http_code}" -b /tmp/session-b.txt -X POST http://127.0.0.1:3000/api/settings/security/password -H 'Content-Type: application/json' --data '{"currentPassword":"wrong","newPassword":"new-settings-password-456","confirmPassword":"new-settings-password-456"}')
          test "$code" = "400"
      - name: Change password and revoke other sessions only
        run: |
          curl --fail --silent -b /tmp/session-b.txt -X POST http://127.0.0.1:3000/api/settings/security/password -H 'Content-Type: application/json' --data '{"currentPassword":"settings-password-123","newPassword":"new-settings-password-456","confirmPassword":"new-settings-password-456"}' > /tmp/password-changed.json
          node -e 'const d=require("/tmp/password-changed.json"); if(!d.ok || d.revokedSessions!==1) process.exit(1)'
          code_a=$(curl --silent --output /tmp/me-a.json --write-out "%{http_code}" -b /tmp/session-a.txt http://127.0.0.1:3000/api/auth/me)
          test "$code_a" = "401"
          curl --fail --silent -b /tmp/session-b.txt http://127.0.0.1:3000/api/auth/me > /tmp/me-b.json
          curl --fail --silent -b /tmp/session-b.txt http://127.0.0.1:3000/api/settings/security/sessions > /tmp/sessions-after-password.json
          node -e 'const d=require("/tmp/sessions-after-password.json"); if(d.sessions.length!==1 || !d.sessions[0].current) process.exit(1)'
          code_old=$(curl --silent --output /tmp/old-password.json --write-out "%{http_code}" -X POST http://127.0.0.1:3000/api/auth/login -H 'Content-Type: application/json' --data '{"email":"settings@example.com","password":"settings-password-123"}')
          test "$code_old" = "401"
      - name: Revoke one other session without logging out current
        run: |
          curl --fail --silent -c /tmp/session-c.txt -X POST http://127.0.0.1:3000/api/auth/login -H 'Content-Type: application/json' --data '{"email":"settings@example.com","password":"new-settings-password-456"}' > /tmp/login-c.json
          curl --fail --silent -b /tmp/session-b.txt http://127.0.0.1:3000/api/settings/security/sessions > /tmp/sessions-with-c.json
          node - <<'NODE'
          const fs=require('fs'); const d=require('/tmp/sessions-with-c.json');
          if(d.sessions.length!==2 || d.sessions.filter(x=>x.current).length!==1) process.exit(1);
          const other=d.sessions.find(x=>!x.current); if(!other) process.exit(1);
          fs.writeFileSync('/tmp/other-session-id',other.id);
          NODE
          other_id=$(cat /tmp/other-session-id)
          curl --fail --silent -b /tmp/session-b.txt -X DELETE http://127.0.0.1:3000/api/settings/security/sessions -H 'Content-Type: application/json' --data "{\"sessionId\":\"$other_id\"}" > /tmp/revoke-one.json
          node -e 'const d=require("/tmp/revoke-one.json"); if(!d.ok || d.revokedSessions!==1 || d.currentSessionRevoked) process.exit(1)'
          code_c=$(curl --silent --output /tmp/me-c.json --write-out "%{http_code}" -b /tmp/session-c.txt http://127.0.0.1:3000/api/auth/me)
          test "$code_c" = "401"
          curl --fail --silent -b /tmp/session-b.txt http://127.0.0.1:3000/api/auth/me >/dev/null
      - name: Render account and public profile surfaces
        run: |
          user_id=$(cat /tmp/settings-user-id)
          curl --fail --silent -b /tmp/session-b.txt http://127.0.0.1:3000/settings > /tmp/settings.html
          curl --fail --silent -b /tmp/session-b.txt http://127.0.0.1:3000/settings/profile > /tmp/settings-profile.html
          curl --fail --silent -b /tmp/session-b.txt http://127.0.0.1:3000/settings/security > /tmp/settings-security.html
          curl --fail --silent -b /tmp/session-b.txt http://127.0.0.1:3000/profile > /tmp/profile.html
          curl --fail --silent http://127.0.0.1:3000/users/$user_id > /tmp/public-profile.html
          grep -q 'ตั้งค่าบัญชี' /tmp/settings.html
          grep -q 'การแจ้งเตือน' /tmp/settings.html
          grep -q 'โปรไฟล์ของคุณ' /tmp/settings-profile.html
          grep -q 'Public Profile' /tmp/settings-profile.html
          grep -q 'ความปลอดภัยของบัญชี' /tmp/settings-security.html
          grep -q 'ความสมบูรณ์โปรไฟล์' /tmp/profile.html
          grep -q 'Public Profile Tent' /tmp/public-profile.html
          grep -q 'คนชลบุรี' /tmp/public-profile.html
          ! grep -q 'settings@example.com' /tmp/public-profile.html
          ! grep -q '0812345678' /tmp/public-profile.html
      - name: Revoke all sessions including current
        run: |
          curl --fail --silent -b /tmp/session-b.txt -X DELETE http://127.0.0.1:3000/api/settings/security/sessions > /tmp/revoke-all.json
          node -e 'const d=require("/tmp/revoke-all.json"); if(!d.ok || d.revokedSessions<1 || !d.currentSessionRevoked) process.exit(1)'
          code=$(curl --silent --output /tmp/me-after-revoke.json --write-out "%{http_code}" -b /tmp/session-b.txt http://127.0.0.1:3000/api/auth/me)
          test "$code" = "401"
          psql "$DATABASE_URL" -Atc "SELECT count(*) FROM user_sessions s JOIN users u ON u.id=s.user_id WHERE u.email='settings@example.com' AND s.revoked_at IS NULL" | grep '^0$'
      - name: Show app log on failure
        if: failure()
        run: cat /tmp/settings-next.log || true
