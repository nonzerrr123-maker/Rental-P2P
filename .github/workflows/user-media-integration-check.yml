name: User media integration check

on:
  pull_request:
    paths:
      - "my-app/lib/profile/avatar.ts"
      - "my-app/app/api/settings/profile/avatar/route.ts"
      - "my-app/app/api/users/[userId]/avatar/route.ts"
      - "my-app/app/settings/profile/**"
      - "my-app/docs/migrations/20260818_task18_user_avatar.sql"
      - ".github/workflows/user-media-integration-check.yml"

jobs:
  validate-user-media:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p2p_rental
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d p2p_rental"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/p2p_rental
      DATABASE_POOL_MAX: 5
      OBJECT_STORAGE_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ACCESS_KEY_ID: minioadmin
      OBJECT_STORAGE_SECRET_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_BUCKET: rental-images
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      NEXT_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-app/package-lock.json
      - run: npm ci
      - name: Apply schema and avatar migration
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/database-schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/migrations/20260818_task18_user_avatar.sql
      - name: Start S3-compatible MinIO
        working-directory: .
        run: |
          docker run -d --name user-media-minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio server /data
          for attempt in {1..40}; do curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null && break; sleep 1; done
          docker run --rm --network host --entrypoint /bin/sh minio/mc -c 'mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb --ignore-existing local/rental-images'
      - name: Scoped lint and build
        run: |
          npx eslint lib/profile/avatar.ts app/api/settings/profile/avatar/route.ts app/api/users/[userId]/avatar/route.ts app/settings/profile/avatar-settings.tsx app/settings/profile/page.tsx
          npm run build
      - name: Start application
        run: |
          nohup npm run start -- -p 3000 >/tmp/user-media-next.log 2>&1 &
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:3000/api/health/db >/dev/null && exit 0; sleep 1; done
          cat /tmp/user-media-next.log; exit 1
      - name: Register user and create image fixtures
        run: |
          curl --fail --silent -X POST http://127.0.0.1:3000/api/auth/register -H 'Content-Type: application/json' --data '{"displayName":"Avatar CI","email":"avatar.ci@example.com","password":"avatar-password-123"}' >/dev/null
          curl --fail --silent -c /tmp/avatar.cookies -X POST http://127.0.0.1:3000/api/auth/login -H 'Content-Type: application/json' --data '{"email":"avatar.ci@example.com","password":"avatar-password-123"}' >/dev/null
          printf '\x89PNG\r\n\x1a\n\x00\x00\x00\rIHDR' >/tmp/avatar.png
          printf 'not-an-image' >/tmp/fake.png
      - name: Guest upload blocked and magic bytes enforced
        run: |
          code=$(curl --silent --output /tmp/guest.json --write-out '%{http_code}' -X POST http://127.0.0.1:3000/api/settings/profile/avatar -F file=@/tmp/avatar.png\;type=image/png)
          test "$code" = "401"
          code=$(curl --silent --output /tmp/fake.json --write-out '%{http_code}' -b /tmp/avatar.cookies -X POST http://127.0.0.1:3000/api/settings/profile/avatar -F file=@/tmp/fake.png\;type=image/png)
          test "$code" = "415"
      - name: Upload proxy and replace avatar safely
        run: |
          curl --fail --silent -b /tmp/avatar.cookies -X POST http://127.0.0.1:3000/api/settings/profile/avatar -F file=@/tmp/avatar.png\;type=image/png >/tmp/upload.json
          user_id=$(psql "$DATABASE_URL" -Atc "SELECT id FROM users WHERE email='avatar.ci@example.com'")
          key=$(psql "$DATABASE_URL" -Atc "SELECT avatar_storage_key FROM users WHERE id='$user_id'")
          test -n "$key"
          case "$key" in user-avatars/$user_id/*) ;; *) exit 1 ;; esac
          curl --fail --silent -D /tmp/avatar.headers "http://127.0.0.1:3000/api/users/$user_id/avatar" >/tmp/avatar-body
          grep -qi '^content-type: image/png' /tmp/avatar.headers
          test "$(wc -c </tmp/avatar-body)" -gt 8
          ! grep -q "$key" /tmp/upload.json
      - name: Delete avatar clears database and object
        run: |
          user_id=$(psql "$DATABASE_URL" -Atc "SELECT id FROM users WHERE email='avatar.ci@example.com'")
          curl --fail --silent -b /tmp/avatar.cookies -X DELETE http://127.0.0.1:3000/api/settings/profile/avatar >/tmp/delete.json
          test "$(psql "$DATABASE_URL" -Atc "SELECT avatar_storage_key IS NULL FROM users WHERE id='$user_id'")" = "t"
          code=$(curl --silent --output /tmp/missing --write-out '%{http_code}' "http://127.0.0.1:3000/api/users/$user_id/avatar")
          test "$code" = "404"
      - name: Render profile settings
        run: |
          curl --fail --silent -b /tmp/avatar.cookies http://127.0.0.1:3000/settings/profile >/tmp/profile.html
          grep -q 'รูปโปรไฟล์' /tmp/profile.html
      - name: Show app log on failure
        if: failure()
        run: cat /tmp/user-media-next.log || true
