name: App PostgreSQL integration check

on:
  pull_request:
    paths:
      - "my-app/**"
      - ".github/workflows/app-db-integration-check.yml"
  push:
    branches:
      - main
    paths:
      - "my-app/**"
      - ".github/workflows/app-db-integration-check.yml"

jobs:
  validate-app-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p2p_rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d p2p_rental"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: my-app

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/p2p_rental
      DATABASE_POOL_MAX: 5
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply PostgreSQL schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/database-schema.sql

      - name: Lint TASK 3 database integration
        run: npx eslint lib/db.ts app/api/health/db/route.ts

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          nohup npm run start -- -p 3000 > /tmp/rental-next.log 2>&1 &
          echo $! > /tmp/rental-next.pid

      - name: Verify database health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health/db > /tmp/db-health.json; then
              break
            fi
            sleep 1
          done

          cat /tmp/db-health.json
          node -e 'const fs=require("fs"); const data=JSON.parse(fs.readFileSync("/tmp/db-health.json","utf8")); if(data.status!=="ok" || data.database!=="p2p_rental") process.exit(1);'

      - name: Show Next.js log on failure
        if: failure()
        run: cat /tmp/rental-next.log || true
