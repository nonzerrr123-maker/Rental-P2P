name: Real geo nearby integration check

on:
  pull_request:
    paths:
      - "my-app/**"
      - ".github/workflows/real-geo-nearby-integration-check.yml"
  push:
    branches:
      - main
    paths:
      - "my-app/**"
      - ".github/workflows/real-geo-nearby-integration-check.yml"

jobs:
  validate-real-geo-nearby:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p2p_rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d p2p_rental"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/p2p_rental
      DATABASE_POOL_MAX: 6
      KYC_PROVIDER: manual
      NEXT_TELEMETRY_DISABLED: 1

    defaults:
      run:
        working-directory: my-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply PostgreSQL schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/database-schema.sql

      - name: Seed geo marketplace fixtures
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (id, email, password_hash, display_name, role, verification_status, is_active)
          VALUES ('11111111-1111-4111-8111-111111111111', 'geo-fixture-owner@example.com', 'fixture', 'Geo Fixture Owner', 'USER', 'VERIFIED', true);

          INSERT INTO rental_items (
            id, owner_id, title, category, description, condition, status,
            hourly_rate, daily_rate, minimum_hours, deposit_amount, urgent_enabled,
            province, district, subdistrict, location_label, latitude, longitude
          ) VALUES
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1','11111111-1111-4111-8111-111111111111','Nearest Drill','เครื่องมือ','รายการใกล้สุดสำหรับทดสอบ nearby','GOOD','ACTIVE',50,300,1,200,true,'ชลบุรี','เมืองชลบุรี','แสนสุข','private exact label',13.285800,100.924200),
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa2','11111111-1111-4111-8111-111111111111','Near Camera','กล้อง','รายการใกล้ประมาณหนึ่งกิโลเมตร','GOOD','ACTIVE',100,700,1,500,true,'ชลบุรี','เมืองชลบุรี','แสนสุข','private exact label',13.298000,100.924200),
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa3','11111111-1111-4111-8111-111111111111','Mid Tent','แคมป์ปิ้ง','รายการห่างประมาณเจ็ดกิโลเมตร','LIKE_NEW','ACTIVE',NULL,250,1,300,false,'ชลบุรี','เมืองชลบุรี','เหมือง','private exact label',13.350000,100.924200),
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa4','11111111-1111-4111-8111-111111111111','Far Projector','อิเล็กทรอนิกส์','รายการไกลเกินห้าสิบกิโลเมตร','GOOD','ACTIVE',NULL,600,1,800,false,'ฉะเชิงเทรา','บางปะกง','บางปะกง','private exact label',13.800000,100.924200),
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa5','11111111-1111-4111-8111-111111111111','Paused Nearby Item','เครื่องมือ','รายการ paused ต้องไม่โผล่','GOOD','PAUSED',50,300,1,200,true,'ชลบุรี','เมืองชลบุรี','แสนสุข','private exact label',13.286000,100.924200),
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa6','11111111-1111-4111-8111-111111111111','Blocked Urgent Item','เครื่องมือ','urgent เปิดแต่ block อยู่ตอนนี้','GOOD','ACTIVE',50,300,1,200,true,'ชลบุรี','เมืองชลบุรี','แสนสุข','private exact label',13.290000,100.924200);

          INSERT INTO item_availability_blocks (item_id, starts_at, ends_at, reason, created_by)
          VALUES ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa6', now() - interval '1 hour', now() + interval '1 hour', 'busy now', '11111111-1111-4111-8111-111111111111');
          SQL

      - name: Lint task18 scope
        run: >-
          npx eslint
          lib/rental/marketplace.ts
          lib/rental/locations.ts
          app/api/rental-items/[id]/location/route.ts
          app/rent/page.tsx
          app/rent/marketplace-filters.tsx
          app/rent/[id]/page.tsx
          app/location/page.tsx
          app/location/nearby-controls.tsx
          app/lend/location/page.tsx
          app/lend/location/location-editor.tsx

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          nohup npm run start -- -p 3000 >/tmp/geo-next.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health/db >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/geo-next.log
          exit 1

      - name: Nearby radius and nearest sort are server authoritative
        run: |
          curl --fail --silent 'http://127.0.0.1:3000/api/rental-items?lat=13.2858&lng=100.9242&radiusKm=5&sort=nearest&limit=20' >/tmp/geo-5.json
          node - <<'NODE'
          const d=require('/tmp/geo-5.json');
          if(!d.ok || d.total!==3) process.exit(1);
          if(d.items[0].title!=='Nearest Drill') process.exit(1);
          if(d.items.some(x=>x.title==='Mid Tent'||x.title==='Far Projector'||x.title==='Paused Nearby Item')) process.exit(1);
          const distances=d.items.map(x=>x.distanceKm);
          if(distances.some(x=>typeof x!=='number')) process.exit(1);
          for(let i=1;i<distances.length;i++) if(distances[i] < distances[i-1]) process.exit(1);
          NODE

          curl --fail --silent 'http://127.0.0.1:3000/api/rental-items?lat=13.2858&lng=100.9242&radiusKm=10&sort=distance&limit=20' >/tmp/geo-10.json
          node -e "const d=require('/tmp/geo-10.json'); if(!d.items.some(x=>x.title==='Mid Tent') || d.items.some(x=>x.title==='Far Projector')) process.exit(1)"

      - name: Urgent nearby only returns items available now
        run: |
          curl --fail --silent 'http://127.0.0.1:3000/api/rental-items?lat=13.2858&lng=100.9242&radiusKm=10&sort=nearest&urgent=1&limit=20' >/tmp/geo-urgent.json
          node - <<'NODE'
          const d=require('/tmp/geo-urgent.json');
          const titles=d.items.map(x=>x.title);
          if(!titles.includes('Nearest Drill') || !titles.includes('Near Camera')) process.exit(1);
          if(titles.includes('Blocked Urgent Item')) process.exit(1);
          if(d.items.some(x=>!x.urgentAvailableNow)) process.exit(1);
          NODE

      - name: Public geo responses never leak owner coordinates
        run: |
          node - <<'NODE'
          const d=require('/tmp/geo-10.json');
          const s=JSON.stringify(d).toLowerCase();
          for(const forbidden of ['latitude','longitude','locationlabel','private exact label']) if(s.includes(forbidden)) process.exit(1);
          NODE
          curl --fail --silent 'http://127.0.0.1:3000/api/rental-items/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaa1' >/tmp/geo-detail.json
          node - <<'NODE'
          const d=require('/tmp/geo-detail.json');
          const s=JSON.stringify(d).toLowerCase();
          for(const forbidden of ['latitude','longitude','locationlabel','private exact label']) if(s.includes(forbidden)) process.exit(1);
          if(!d.item.urgentAvailableNow) process.exit(1);
          NODE

      - name: Invalid and hostile geo queries are rejected safely
        run: |
          code=$(curl --silent --output /tmp/geo-bad-lat.json --write-out '%{http_code}' 'http://127.0.0.1:3000/api/rental-items?lat=91&lng=100&radiusKm=10')
          test "$code" = "400"
          code=$(curl --silent --output /tmp/geo-huge-radius.json --write-out '%{http_code}' 'http://127.0.0.1:3000/api/rental-items?lat=13&lng=100&radiusKm=500')
          test "$code" = "400"
          code=$(curl --silent --output /tmp/geo-half-location.json --write-out '%{http_code}' 'http://127.0.0.1:3000/api/rental-items?lat=13&radiusKm=10')
          test "$code" = "400"

          curl --fail --silent --get 'http://127.0.0.1:3000/api/rental-items' --data-urlencode "q='; DROP TABLE users; --" >/tmp/geo-injection.json
          test "$(psql "$DATABASE_URL" -Atc 'SELECT count(*) FROM users')" -ge 1

      - name: Province district and subdistrict fallback works without geolocation
        run: |
          curl --fail --silent --get 'http://127.0.0.1:3000/api/rental-items' --data-urlencode 'province=ชลบุรี' --data-urlencode 'district=เมืองชลบุรี' --data-urlencode 'subdistrict=เหมือง' >/tmp/geo-area.json
          node -e "const d=require('/tmp/geo-area.json'); if(d.total!==1 || d.items[0].title!=='Mid Tent') process.exit(1)"

      - name: Owner can update location but stranger cannot forge ownership
        run: |
          curl --fail --silent -X POST http://127.0.0.1:3000/api/auth/register -H 'Content-Type: application/json' --data '{"displayName":"Geo Owner","email":"geo-owner@example.com","password":"geo-owner-password"}' >/dev/null
          curl --fail --silent -X POST http://127.0.0.1:3000/api/auth/register -H 'Content-Type: application/json' --data '{"displayName":"Geo Stranger","email":"geo-stranger@example.com","password":"geo-stranger-password"}' >/dev/null
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "UPDATE users SET verification_status='VERIFIED' WHERE email IN ('geo-owner@example.com','geo-stranger@example.com');"
          curl --fail --silent -c /tmp/geo-owner-cookie -X POST http://127.0.0.1:3000/api/auth/login -H 'Content-Type: application/json' --data '{"email":"geo-owner@example.com","password":"geo-owner-password"}' >/dev/null
          curl --fail --silent -c /tmp/geo-stranger-cookie -X POST http://127.0.0.1:3000/api/auth/login -H 'Content-Type: application/json' --data '{"email":"geo-stranger@example.com","password":"geo-stranger-password"}' >/dev/null

          curl --fail --silent -b /tmp/geo-owner-cookie -X POST http://127.0.0.1:3000/api/rental-items -H 'Content-Type: application/json' --data '{"title":"Owner Geo Listing","category":"เครื่องมือ","description":"รายการจริงสำหรับทดสอบแก้พื้นที่ของเจ้าของ","condition":"GOOD","dailyRate":250,"minimumHours":1,"depositAmount":0,"province":"กรุงเทพมหานคร"}' >/tmp/geo-owner-item.json
          node -e "const d=require('/tmp/geo-owner-item.json'); if(!d.ok) process.exit(1); require('fs').writeFileSync('/tmp/geo-owner-id',d.item.id)"
          item_id=$(cat /tmp/geo-owner-id)

          curl --fail --silent -b /tmp/geo-owner-cookie -X PATCH "http://127.0.0.1:3000/api/rental-items/$item_id/location" -H 'Content-Type: application/json' --data '{"province":"ชลบุรี","district":"เมืองชลบุรี","subdistrict":"แสนสุข","locationLabel":"owner private meeting point","latitude":13.2865,"longitude":100.925}' >/tmp/geo-owner-update.json
          node -e "const d=require('/tmp/geo-owner-update.json'); if(!d.ok || d.location.province!=='ชลบุรี') process.exit(1)"

          code=$(curl --silent --output /tmp/geo-stranger-update.json --write-out '%{http_code}' -b /tmp/geo-stranger-cookie -X PATCH "http://127.0.0.1:3000/api/rental-items/$item_id/location" -H 'Content-Type: application/json' --data '{"province":"ระยอง","latitude":12.6,"longitude":101.2}')
          test "$code" = "403"
          code=$(curl --silent --output /tmp/geo-owner-invalid.json --write-out '%{http_code}' -b /tmp/geo-owner-cookie -X PATCH "http://127.0.0.1:3000/api/rental-items/$item_id/location" -H 'Content-Type: application/json' --data '{"province":"ชลบุรี","latitude":99,"longitude":100}')
          test "$code" = "400"

          curl --fail --silent "http://127.0.0.1:3000/api/rental-items?lat=13.2858&lng=100.9242&radiusKm=5&q=Owner%20Geo%20Listing" >/tmp/geo-owner-public.json
          node - <<'NODE'
          const d=require('/tmp/geo-owner-public.json');
          if(d.total!==1) process.exit(1);
          const s=JSON.stringify(d).toLowerCase();
          for(const forbidden of ['latitude','longitude','owner private meeting point']) if(s.includes(forbidden)) process.exit(1);
          NODE

      - name: Real location pages render without old mock data
        run: |
          curl --fail --silent --get 'http://127.0.0.1:3000/location' --data-urlencode 'province=ชลบุรี' >/tmp/geo-location-page.html
          grep -q 'Nearest Drill' /tmp/geo-location-page.html
          ! grep -q 'Game House' /tmp/geo-location-page.html
          ! grep -q 'L-001' /tmp/geo-location-page.html
          curl --fail --silent -b /tmp/geo-owner-cookie 'http://127.0.0.1:3000/lend/location' >/tmp/geo-lend-location.html
          grep -q 'Owner Geo Listing' /tmp/geo-lend-location.html

      - name: Show Next.js log on failure
        if: failure()
        run: cat /tmp/geo-next.log || true
