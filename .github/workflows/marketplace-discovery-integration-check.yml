name: Marketplace discovery integration check

on:
  pull_request:
    paths:
      - "my-app/**"
      - ".github/workflows/marketplace-discovery-integration-check.yml"
  push:
    branches:
      - main
    paths:
      - "my-app/**"
      - ".github/workflows/marketplace-discovery-integration-check.yml"

jobs:
  validate-marketplace-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p2p_rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d p2p_rental"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/p2p_rental
      DATABASE_POOL_MAX: 5
      ADMIN_EMAIL: superadmin.marketplace-ci@example.com
      ADMIN_PASSWORD: marketplace-ci-superadmin-password
      KYC_PROVIDER: manual
      NEXT_TELEMETRY_DISABLED: 1

    defaults:
      run:
        working-directory: my-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply PostgreSQL schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/database-schema.sql

      - name: Seed public marketplace fixtures
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO users (id, email, password_hash, display_name, role, verification_status, rating_average, rating_count, is_active)
          VALUES
            ('11111111-1111-4111-8111-111111111111', 'owner.marketplace@example.com', 'fixture-password-hash', 'Beach Gear Chonburi', 'USER', 'VERIFIED', 4.80, 12, true),
            ('22222222-2222-4222-8222-222222222222', 'inactive.marketplace@example.com', 'fixture-password-hash', 'Inactive Owner', 'USER', 'VERIFIED', 5.00, 1, false);

          INSERT INTO rental_items (
            id, owner_id, title, category, description, condition, status,
            hourly_rate, daily_rate, minimum_hours, deposit_amount,
            urgent_enabled, urgent_reservation_fee_rate,
            province, district, subdistrict, location_label, latitude, longitude
          ) VALUES
            (
              'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
              '11111111-1111-4111-8111-111111111111',
              'Sony A7III Camera', 'กล้อง', 'กล้อง Sony พร้อมเลนส์และแบตเตอรี่สำหรับงานถ่ายภาพ', 'GOOD', 'ACTIVE',
              100, 700, 2, 3000, true, 0.05,
              'ชลบุรี', 'เมืองชลบุรี', 'แสนสุข', 'จุดรับใกล้ชายหาดบางแสน', 13.285800, 100.924200
            ),
            (
              'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
              '11111111-1111-4111-8111-111111111111',
              'Naturehike Tent 4P', 'แคมป์ปิ้ง', 'เต็นท์สี่คนพร้อมฟลายชีทและสมอบก', 'LIKE_NEW', 'ACTIVE',
              NULL, 250, 1, 1000, false, 0.05,
              'ชลบุรี', 'ศรีราชา', 'สุรศักดิ์', 'จุดรับใกล้ตัวเมือง', 13.172600, 100.931000
            ),
            (
              'cccccccc-cccc-4ccc-8ccc-cccccccccccc',
              '11111111-1111-4111-8111-111111111111',
              'Cordless Drill', 'เครื่องมือ', 'สว่านไร้สายพร้อมแบตสำรองและชุดดอก', 'FAIR', 'ACTIVE',
              60, NULL, 2, 500, false, 0.05,
              'ระยอง', 'เมืองระยอง', 'เนินพระ', 'จุดรับหน้าร้าน', 12.680000, 101.280000
            ),
            (
              'dddddddd-dddd-4ddd-8ddd-dddddddddddd',
              '11111111-1111-4111-8111-111111111111',
              'Paused Projector', 'อิเล็กทรอนิกส์', 'รายการพักการให้เช่าที่ต้องไม่ปรากฏใน public marketplace', 'GOOD', 'PAUSED',
              NULL, 500, 1, 1500, false, 0.05,
              'ชลบุรี', 'เมืองชลบุรี', 'แสนสุข', 'private label', 13.286000, 100.925000
            ),
            (
              'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee',
              '22222222-2222-4222-8222-222222222222',
              'Inactive Owner Item', 'เครื่องมือ', 'รายการเจ้าของถูกปิดใช้งานที่ต้องไม่แสดง', 'GOOD', 'ACTIVE',
              NULL, 100, 1, 0, false, 0.05,
              'ชลบุรี', 'เมืองชลบุรี', 'แสนสุข', 'private label', 13.286100, 100.925100
            );

          INSERT INTO rental_images (id, item_id, storage_key, alt_text, sort_order)
          VALUES
            ('f1111111-1111-4111-8111-111111111111', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', 'fixtures/sony-cover.jpg', 'Sony camera cover', 0),
            ('f2222222-2222-4222-8222-222222222222', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', 'fixtures/sony-side.jpg', 'Sony camera side', 1);
          SQL

      - name: Lint marketplace scope
        run: >-
          npx eslint
          lib/rental/marketplace.ts
          app/api/rental-items/route.ts
          app/api/rental-items/[id]/route.ts
          app/rent/page.tsx
          app/rent/marketplace-filters.tsx
          app/rent/[id]/page.tsx
          app/rent/nearby/page.tsx

      - name: Build application
        run: npm run build

      - name: Start application
        run: |
          nohup npm run start -- -p 3000 > /tmp/marketplace-next.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health/db >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/marketplace-next.log
          exit 1

      - name: Public marketplace hides inactive listings and owners
        run: |
          curl --fail --silent 'http://127.0.0.1:3000/api/rental-items' >/tmp/marketplace-all.json
          node - <<'NODE'
          const data = require('/tmp/marketplace-all.json');
          if (!data.ok || data.total !== 3 || data.items.length !== 3) process.exit(1);
          const titles = data.items.map((item) => item.title);
          if (titles.includes('Paused Projector') || titles.includes('Inactive Owner Item')) process.exit(1);
          if (!data.items.find((item) => item.title === 'Sony A7III Camera')?.coverImageUrl) process.exit(1);
          NODE

      - name: Search and structured filters work
        run: |
          curl --fail --silent --get 'http://127.0.0.1:3000/api/rental-items' --data-urlencode 'q=Sony' >/tmp/marketplace-search.json
          node -e "const d=require('/tmp/marketplace-search.json'); if(d.total!==1 || d.items[0].title!=='Sony A7III Camera') process.exit(1)"

          curl --fail --silent --get 'http://127.0.0.1:3000/api/rental-items' --data-urlencode 'category=แคมป์ปิ้ง' >/tmp/marketplace-category.json
          node -e "const d=require('/tmp/marketplace-category.json'); if(d.total!==1 || d.items[0].title!=='Naturehike Tent 4P') process.exit(1)"

          curl --fail --silent --get 'http://127.0.0.1:3000/api/rental-items' --data-urlencode 'province=ชลบุรี' --data-urlencode 'subdistrict=แสนสุข' >/tmp/marketplace-location.json
          node -e "const d=require('/tmp/marketplace-location.json'); if(d.total!==1 || d.items[0].title!=='Sony A7III Camera') process.exit(1)"

          curl --fail --silent 'http://127.0.0.1:3000/api/rental-items?urgent=1&pricingMode=HOUR&minPrice=80&maxPrice=120' >/tmp/marketplace-urgent.json
          node -e "const d=require('/tmp/marketplace-urgent.json'); if(d.total!==1 || !d.items[0].urgentEnabled) process.exit(1)"

      - name: Nearby radius is calculated server side
        run: |
          curl --fail --silent 'http://127.0.0.1:3000/api/rental-items?lat=13.285800&lng=100.924200&radiusKm=5&sort=distance' >/tmp/marketplace-nearby.json
          node - <<'NODE'
          const data = require('/tmp/marketplace-nearby.json');
          if (data.total !== 1 || data.items[0].title !== 'Sony A7III Camera') process.exit(1);
          if (typeof data.items[0].distanceKm !== 'number' || data.items[0].distanceKm > 0.1) process.exit(1);
          if ('latitude' in data.items[0] || 'longitude' in data.items[0]) process.exit(1);
          NODE

      - name: Invalid public query is rejected
        run: |
          code=$(curl --silent --output /tmp/marketplace-invalid-radius.json --write-out '%{http_code}' 'http://127.0.0.1:3000/api/rental-items?radiusKm=10')
          test "$code" = "400"
          node -e "const d=require('/tmp/marketplace-invalid-radius.json'); if(d.code!=='VALIDATION_ERROR' || !d.fieldErrors.radiusKm) process.exit(1)"

          code=$(curl --silent --output /tmp/marketplace-invalid-condition.json --write-out '%{http_code}' 'http://127.0.0.1:3000/api/rental-items?condition=BROKEN')
          test "$code" = "400"

          code=$(curl --silent --output /tmp/marketplace-invalid-limit.json --write-out '%{http_code}' 'http://127.0.0.1:3000/api/rental-items?limit=49')
          test "$code" = "400"

      - name: Public detail is real, ordered, and privacy safe
        run: |
          curl --fail --silent 'http://127.0.0.1:3000/api/rental-items/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa' >/tmp/marketplace-detail.json
          node - <<'NODE'
          const data = require('/tmp/marketplace-detail.json');
          const item = data.item;
          if (!data.ok || item.title !== 'Sony A7III Camera' || item.images.length !== 2) process.exit(1);
          if (!item.images[0].contentUrl.endsWith('/f1111111-1111-4111-8111-111111111111/content')) process.exit(1);
          const serialized = JSON.stringify(item).toLowerCase();
          for (const forbidden of ['email','phone','password','storage_key','storagekey','latitude','longitude','locationlabel','provider_reference']) {
            if (serialized.includes(forbidden)) process.exit(1);
          }
          if (item.owner.displayName !== 'Beach Gear Chonburi' || !item.owner.verified) process.exit(1);
          NODE

          code=$(curl --silent --output /tmp/marketplace-paused-detail.json --write-out '%{http_code}' 'http://127.0.0.1:3000/api/rental-items/dddddddd-dddd-4ddd-8ddd-dddddddddddd')
          test "$code" = "404"
          code=$(curl --silent --output /tmp/marketplace-bad-id.json --write-out '%{http_code}' 'http://127.0.0.1:3000/api/rental-items/not-a-uuid')
          test "$code" = "404"

      - name: Marketplace pages render PostgreSQL data
        run: |
          curl --fail --silent --get 'http://127.0.0.1:3000/rent' --data-urlencode 'q=Sony' >/tmp/marketplace-page.html
          grep -q 'Sony A7III Camera' /tmp/marketplace-page.html
          ! grep -q 'Paused Projector' /tmp/marketplace-page.html

          curl --fail --silent 'http://127.0.0.1:3000/rent/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa' >/tmp/marketplace-detail-page.html
          grep -q 'Sony A7III Camera' /tmp/marketplace-detail-page.html
          ! grep -q 'PlayStation 5' /tmp/marketplace-detail-page.html

      - name: Show Next.js log on failure
        if: failure()
        run: cat /tmp/marketplace-next.log || true
