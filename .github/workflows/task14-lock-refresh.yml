name: Task 14 lock refresh

on:
  push:
    branches:
      - agent/task-14-shadcn-form-foundation
    paths:
      - my-app/package.json

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/task-14-shadcn-form-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-app/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh task14 dependency lock"
          git push origin HEAD:agent/task-14-shadcn-form-foundation
